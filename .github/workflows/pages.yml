# Deploy the static ACEBasicJS host to GitHub Pages.
# One-time: Repo Settings → Pages → Build and deployment → Source: GitHub Actions.
# Also: the repository must be public (or the account must allow Pages on private repos).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll
          cp -R examples src docs _site/
          # Static assets (ACE logo, later Topaz, …)
          if [ -d public ]; then cp -R public _site/; fi
          # Optional: keep README out of the site root noise
          test -f README.md && cp README.md _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

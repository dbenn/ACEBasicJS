<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACEBasicJS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/ui/styles.css" />
    <link rel="icon" href="public/ace.gif" type="image/gif" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://github.com/dbenn/ACEBasicJS" title="ACEBasicJS">
        <img
          class="brand-logo"
          src="public/ace.gif"
          width="249"
          height="125"
          alt="ACE Basic"
        />
        <span class="brand-text">ACEBasic<span class="brand-js">JS</span></span>
      </a>
      <div class="controls">
        <label for="program-picker">Program</label>
        <select id="program-picker" aria-label="Program picker"></select>
        <button type="button" class="primary" id="run">Run</button>
        <button type="button" id="stop" disabled>Stop</button>
      </div>
    </header>

    <main class="main">
      <section class="panel editor-panel" id="source-panel" aria-label="ACE source">
        <h1 class="panel-title">ACE source (always visible · editable)</h1>
        <textarea id="source" spellcheck="false" aria-label="ACE program source"></textarea>
      </section>
      <div
        class="splitter"
        id="splitter"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize source and display panes"
        aria-controls="source-panel display-panel"
        tabindex="0"
      ></div>
      <section class="panel output-panel" aria-label="Program display" id="display-panel">
        <h2 class="panel-title">Display</h2>
        <div
          id="screens"
          class="screens"
          hidden
          aria-hidden="true"
          aria-label="Intuition screens"
          tabindex="0"
        ></div>
        <div
          id="console"
          class="console"
          tabindex="0"
          role="log"
          aria-label="Program console"
          aria-live="polite"
        ><pre id="output" class="console-output"></pre><span
            id="live-input"
            class="live-input"
            aria-hidden="true"
          ></span><span id="caret" class="caret" hidden aria-hidden="true"></span><input
            id="console-input"
            class="console-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="Program input (Enter to submit)"
            tabindex="-1"
            disabled
          /></div>
      </section>
    </main>

    <div class="status" id="status" role="status"></div>

    <script src="src/runtime/runtime.js"></script>
    <script src="src/compiler/compiler.js"></script>
    <script src="src/ui/app.js"></script>
  </body>
</html>
